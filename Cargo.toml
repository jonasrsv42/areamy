[package]
name = "areamy"
version = "0.1.0"
edition = "2024"
# benches/support.rs is shared code, not a bench target.
autobenches = false

[features]
default = []
# Disables stderr output for thread errors. By default, ThreadStream prints
# errors to stderr because they occur in spawned threads and may go unnoticed
# if the caller doesn't properly join. This can make debugging silent failures
# very difficult. Enable this feature to suppress these prints.
silent = []
# Exposes `poll::waker::mock` (timer-backed test wakers) to
# downstream crates. Enable from [dev-dependencies] only.
testing = []

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "edge"
harness = false

[[bench]]
name = "work"
harness = false

[[bench]]
name = "pull"
harness = false

[[bench]]
name = "poll"
harness = false

