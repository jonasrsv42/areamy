[package]
name = "areamy"
version = "0.1.0"
edition = "2024"
# benches/common.rs and modules under benches/<area>/ are shared code, not bench targets.
autobenches = false

[features]
default = []
# Disables stderr output for thread errors. By default, ThreadStream prints
# errors to stderr because they occur in spawned threads and may go unnoticed
# if the caller doesn't properly join. This can make debugging silent failures
# very difficult. Enable this feature to suppress these prints.
silent = []
# Logs every block, park and resume on a full edge to stderr. Backpressure is normal
# operation, so this is opt-in: turn it on to find a stall.
trace = []
# Exposes the test mocks (`wake::mock`, `poll::context::mock`,
# `poll::timer::mock`) to downstream crates. Enable from [dev-dependencies] only.
testing = []

[lib]
# Benches are criterion targets; libtest would reject criterion's flags.
bench = false

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "edge"
harness = false

[[bench]]
name = "work"
harness = false

[[bench]]
name = "pull"
harness = false

[[bench]]
name = "poll"
path = "benches/poll/main.rs"
harness = false

# `cargo test` runs the example's `main`, so its backpressure check can't regress unnoticed.
[[example]]
name = "simple_speech_example"
test = true
harness = false
